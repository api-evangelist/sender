name: Sender
description: >-
  Sender (Sender Wallet, by Sender Labs / SENDER TECH LIMITED) is a self-custody
  multi-chain Web3 wallet for NEAR, Ethereum and all EVM-compatible chains
  (Polygon, BNB Chain, Arbitrum, Optimism, Avalanche, Scroll, zkSync Era, TON
  and 20+ networks), shipping as a Chrome/Brave/Edge browser extension and iOS
  and Android apps. For developers, Sender exposes an injected browser-provider
  API: dApps detect the wallet on window.sender.near / window.sender.ethereum
  (with legacy window.near support), request sign-in / account access, and sign
  and broadcast transactions. The Ethereum provider follows EIP-1193 and
  EIP-1102; NEAR exposes requestSignIn, signAndSendTransaction and request. The
  wallet is audited by SlowMist and runs a bug bounty. Surfaced as a portfolio
  company of Pantera Capital.
